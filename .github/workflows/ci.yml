name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: chatapp
  DEPLOY_ROLE: arn:aws:iam::102076848646:role/chatapp-github-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t chatapp-backend ./backend
      - run: docker build -t chatapp-frontend ./frontend

  deploy:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Get AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          for svc in backend frontend; do
            docker build -t $REGISTRY/chatapp-$svc:$TAG -t $REGISTRY/chatapp-$svc:latest ./$svc
            docker push --all-tags $REGISTRY/chatapp-$svc
          done

      - name: Render backend task definition
        id: backend-td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/backend-task.json
          container-name: backend
          image: ${{ steps.ecr.outputs.registry }}/chatapp-backend:${{ github.sha }}

      - name: Deploy backend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-td.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: backend
          wait-for-service-stability: true

      - name: Render frontend task definition
        id: frontend-td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/frontend-task.json
          container-name: frontend
          image: ${{ steps.ecr.outputs.registry }}/chatapp-frontend:${{ github.sha }}

      - name: Deploy frontend
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-td.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: frontend
          wait-for-service-stability: true
