services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp -d chatapp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: 102076848646.dkr.ecr.ap-south-1.amazonaws.com/chatapp-backend:latest
    environment:
      DATABASE_URL: postgresql+psycopg://chatapp:${POSTGRES_PASSWORD}@db:5432/chatapp
      JWT_SECRET: ${JWT_SECRET}
      LLM_PROVIDER: google
      LLM_MODEL: ${LLM_MODEL}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: 102076848646.dkr.ecr.ap-south-1.amazonaws.com/chatapp-frontend:latest
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
